import os

def count_files(folder_path):
    """Count .py and .sql files in a folder"""
    if not os.path.exists(folder_path):
        return 0
    return len([f for f in os.listdir(folder_path) if f.endswith(('.py', '.sql'))])

def generate_readme():
    topics = [
        ('Python/Arrays', 'Arrays'),
        ('Python/Easy', 'Easy'),
        ('SQL/Easy', 'SQL'),  # ← SQL/Easy dhyan se!
    ]
    
    readme = """# LeetCode Solutions
My daily LeetCode practice for Data Engineering interviews.

## Progress Tracker

| Category | Solved | Link |
|----------|--------|------|
"""
    
    total = 0
    for folder, name in topics:
        count = count_files(folder)
        total += count
        status = "🟢 Active" if count > 0 else "⚪ Empty"
        link = f"[View]({folder}/)" if count > 0 else "—"
        readme += f"| {name} | {count} | {link} |\n"
    
    readme += f"| **Total** | **{total}** | — |\n"
    
    readme += """
## File Naming Convention
- Python: `XXXX-problem-name.py`
- SQL: `XXX-problem-name.sql`
"""
    
    with open('README.md', 'w') as f:
        f.write(readme)
    
    print(f"README updated! Total problems: {total}")

if __name__ == "__main__":
    generate_readme()
